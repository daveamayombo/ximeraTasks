services:
  app:
    image: ghcr.io/ximeraproject/ximeralatex:v2.6.5
    # image: ghcr.io/ximeraproject/xake2024:v2.6.5-full
    volumes:
      # This is where VS Code should expect to find your project's source code and the value of "workspaceFolder" in .devcontainer/devcontainer.json
      - ..:/code:cached
    command: /bin/sh -c "while sleep 1000; do :; done"   # run forever
    network_mode: service:ximeraserver
  ximeraserver:
    image: registry.gitlab.kuleuven.be/wet/ximera/ximeradocker:2.3_b
    volumes:
      - ../server-js:/usr/var/server/public/javascripts
      - ../server-views:/usr/var/server/views
      - ../start.sh:/usr/var/server/start.sh
    ports:
      - "2000:2000"          # Expose Ximera on port 2080
